<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura & Earth — Artisanal Tableware for Hotels, Restaurants & Cafés</title>
  <meta name="description" content="Discover handcrafted artisanal tableware by Aura & Earth. Premium ceramics, drinkware, metals, serveware and table décor designed for elevated hospitality experiences.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/jpeg" href="/images/brand/logo.jpg">
</head>
<body>

  <!-- Announcement Bar -->
  <div class="announcement-bar" id="announcementBar">
    Free shipping on orders above Rs. 10,000 &nbsp;·&nbsp; <span>Handcrafted with intention</span> &nbsp;·&nbsp; Each piece is unique
  </div>

  <!-- Navigation -->
  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="#" class="nav-logo" onclick="navigate('home')">
        <img src="/images/brand/logo.jpg" alt="Aura & Earth">
      </a>
      
      <div class="nav-links" id="navLinks">
        <a href="#" onclick="navigate('home')" class="active" data-page="home">Home</a>
        <a href="#" onclick="navigate('shop')" data-page="shop">Shop All</a>
        <a href="#" onclick="navigate('shop', 'servings')" data-page="servings">Servings</a>
        <a href="#" onclick="navigate('shop', 'drinkware')" data-page="drinkware">Drinkware</a>
        <a href="#" onclick="navigate('shop', 'metals')" data-page="metals">Metals</a>
        <a href="#" onclick="navigate('shop', 'serveware')" data-page="serveware">Serveware</a>
        <a href="#" onclick="navigate('shop', 'decor')" data-page="decor">Décor</a>
        <a href="#" onclick="navigate('about')" data-page="about">Our Story</a>
      </div>
      
      <div class="nav-actions">
        <button class="nav-action-btn" onclick="openSearch()" id="searchBtn" title="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        </button>
        <button class="nav-action-btn" onclick="toggleAuth()" id="accountBtn" title="Account">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span id="accountLabel"></span>
        </button>
        <button class="nav-action-btn" onclick="toggleCart()" id="cartBtn" title="Cart">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span class="cart-count" id="cartCount" style="display:none">0</span>
        </button>
        <button class="mobile-menu-btn" onclick="toggleMobileMenu()" id="mobileMenuBtn">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Content Area -->
  <main id="app"></main>

  <!-- Cart Drawer -->
  <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
  <div class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
      <h3>Your Cart</h3>
      <button class="cart-close" onclick="toggleCart()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-footer" id="cartFooter" style="display:none">
      <div class="cart-subtotal">
        <span>Subtotal</span>
        <span id="cartSubtotal">Rs. 0</span>
      </div>
      <div class="cart-subtotal">
        <span>Shipping</span>
        <span>Rs. 500</span>
      </div>
      <div class="cart-total">
        <span>Total</span>
        <span id="cartTotal">Rs. 0</span>
      </div>
      <button class="btn btn-primary" style="width:100%" onclick="navigate('checkout'); toggleCart();">Checkout</button>
      <button class="btn btn-secondary" style="width:100%; margin-top: 8px" onclick="navigate('shop'); toggleCart();">Continue Shopping</button>
    </div>
  </div>

  <!-- Auth Modal -->
  <div class="modal-overlay" id="authModal">
    <div class="modal">
      <button class="modal-close" onclick="closeAuthModal()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div id="authContent"></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Scroll to Top -->
  <button class="scroll-top" id="scrollTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 15l-6-6-6 6"/></svg>
  </button>

  <script src="/js/app.js"></script>
</body>
</html>
